name: Trader Alerts

on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          - name: Check alerts
          run: |
          python3 alerts.py check || echo "check: nothing rang (exit 1 = nothing hit)"
